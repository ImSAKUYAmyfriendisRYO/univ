<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 인물지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#E7EAE3;--surface:#F4F6F1;--surface-2:#DDE2D8;--ink:#18221E;--ink-2:#4C584F;--muted:#8A968C;--line:#C6CEC3;--line-soft:#D6DCD1;--jade:#2E6E63;--vermilion:#B8402E;--gold:#A8791F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1618;--surface:#18211F;--surface-2:#212B28;--ink:#E7EDE6;--ink-2:#A8B5AC;--muted:#6D7C74;--line:#2B3733;--line-soft:#232E2B;--jade:#6FC7B3;--vermilion:#EC7758;--gold:#D7A852}}
:root[data-theme="dark"]{--bg:#0F1618;--surface:#18211F;--surface-2:#212B28;--ink:#E7EDE6;--ink-2:#A8B5AC;--muted:#6D7C74;--line:#2B3733;--line-soft:#232E2B;--jade:#6FC7B3;--vermilion:#EC7758;--gold:#D7A852}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:1360px;margin:0 auto;padding:28px 20px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.eyebrow{font:400 12px "IBM Plex Mono",monospace;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.theme{background:none;border:1px solid var(--line);color:var(--ink-2);font:500 11px "IBM Plex Mono",monospace;padding:6px 10px;cursor:pointer}
h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.1;margin:10px 0 0}
.dek{margin:10px 0 0;max-width:64ch;color:var(--ink-2);font-size:15px;font-weight:300}.dek strong{color:var(--ink);font-weight:500}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:22px}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 16px 11px;font:400 14px "IBM Plex Sans KR",sans-serif;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink-2)}.tab[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--vermilion)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;margin-top:20px;align-items:start}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.panel{position:static!important}}
.mapbox{border:1px solid var(--line);background:var(--surface)}
svg.map{display:block;width:100%;height:auto}
.grid{stroke:var(--line-soft);stroke-width:.6}
.ring{fill:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:4 4;opacity:.85}
.ringlbl{font:500 10px "IBM Plex Mono",monospace;fill:var(--gold)}
.pdot{fill:var(--jade);stroke:var(--surface);stroke-width:2;cursor:pointer;transition:opacity .15s}
.pdot.on{fill:var(--vermilion)}.pdot.dim{opacity:.18}
.campus{fill:var(--vermilion)}
.clbl{font:600 12px "IBM Plex Sans KR",sans-serif;fill:var(--ink)}
.city{font:500 11px "IBM Plex Sans KR",sans-serif;fill:var(--ink-2);text-anchor:middle;pointer-events:none}
.nomap{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 18px}
.nomap button{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer}
.panel{position:sticky;top:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.ph{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.kicker{font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
.panel h2{font-family:"Gowun Batang",serif;font-size:32px;margin:6px 0 0;line-height:1.15}
.sub{font-size:13px;color:var(--ink-2)}
.fields{padding:4px 20px;margin:0}
.f{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.f:last-child{border-bottom:0}.f dt{font:500 11px "IBM Plex Mono",monospace;color:var(--muted);padding-top:3px}.f dd{margin:0;word-break:break-all}
.f dd a,td a{color:var(--jade);text-decoration:none}.none{color:var(--muted)}
.preview{border-top:1px solid var(--line);background:var(--surface-2)}
.bar{display:flex;justify-content:space-between;padding:8px 12px;font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
.bar a{color:var(--vermilion);text-decoration:none}
.frame{height:240px;background:#fff;overflow:hidden;position:relative}
.frame iframe{border:0;width:200%;height:200%;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:13px}
.nav{display:flex;border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:0;padding:12px;font:500 12px "IBM Plex Mono",monospace;color:var(--ink-2);cursor:pointer}
.nav button+button{border-left:1px solid var(--line)}.nav button:hover{color:var(--ink);background:var(--surface-2)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-top:24px}
@media (max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}}
.summary>div{padding:16px 18px;border-right:1px solid var(--line)}.summary>div:last-child{border-right:0}
.k{font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
.v{font-family:"Gowun Batang",serif;font-size:30px;font-weight:700;margin-top:4px}.v small{font:400 13px "IBM Plex Sans KR",sans-serif;color:var(--muted);margin-left:3px}
.roster{margin-top:28px}.roster h3{font:500 12px "IBM Plex Mono",monospace;color:var(--muted);margin:0 0 8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font:500 11px "IBM Plex Mono",monospace;color:var(--muted);border-bottom-color:var(--line);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover td,tbody tr.on td{background:var(--surface)}
td.m{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);white-space:nowrap}
.src{margin-top:12px;font:400 11px "IBM Plex Mono",monospace;color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;opacity:0;z-index:9}
:focus-visible{outline:2px solid var(--vermilion);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><span>경동대학교 메트로폴캠퍼스</span><span>2026-2학기</span><span>GitHub Pages 실습</span></div>
    <button class="theme" id="theme" type="button">LIGHT / DARK</button>
  </div>
  <h1>우리 반 인물지도</h1>
  <p class="dek" id="dek"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="stage">
    <div class="mapbox">
      <svg class="map" id="map" viewBox="0 0 960 600" role="img" aria-label="수강생 거주지 지도"></svg>
      <div class="nomap" id="nomap"></div>
    </div>
    <aside class="panel" aria-live="polite">
      <div class="ph"><div class="kicker" id="pk"></div><h2 id="pn"></h2><div class="sub" id="ps"></div></div>
      <dl class="fields" id="pf"></dl>
      <div class="preview">
        <div class="bar"><span>PAGE PREVIEW</span><a id="popen" target="_blank" rel="noopener">새 탭에서 열기 ↗</a></div>
        <div class="frame" id="frame"></div>
      </div>
      <div class="nav"><button id="prev" type="button">← 이전</button><button id="next" type="button">다음 →</button></div>
    </aside>
  </div>
  <div class="summary" id="summary"></div>
  <section class="roster">
    <h3>전체 명단</h3>
    <div class="tw"><table>
      <thead><tr><th>#</th><th>이름</th><th>사는 곳</th><th>학교에서</th><th>취미</th><th>가장 아끼는 것</th><th>제출 페이지</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="src">출처: 수강생 자기소개·GitHub 제출 시트 · 위치는 행정동(또는 시) 중심의 근사 좌표, 거리는 학교까지의 직선거리</p>
  </section>
</div>
<div id="tip"></div>
<script>
const P=[
{n:"박종석",gh:"https://github.com/John02-design",pg:"https://john02-design.github.io/1234/",h:"일렉기타, 영화감상",a:"경기도 의정부시 민락동",t:"나",c:"의정부시",km:8,x:277.8,y:256.8},
{n:"박준영",gh:"https://github.com/alex60796-bot",pg:"https://alex60796-bot.github.io/dkssudgktpdy/",h:"피파",a:"경기도 의정부시 의정부동",t:"김보라",c:"의정부시",km:9,x:242.2,y:264.9},
{n:"강민서",gh:"https://github.com/rlverms",pg:"https://rlverms.github.io/rlverms/",h:"쿠리만쥬 인형 구매",a:"",t:"",c:"",km:null},
{n:"박정빈",gh:"https://github.com/ImSAKUYAmyfriendisRYO",pg:"https://imsakuyamyfriendisryo.github.io/-/",h:"노래듣기",a:"거제시 장평동",t:"나 ^.....^",c:"거제시",km:353,far:1},
{n:"김나림",gh:"https://github.com/nalimgim947",pg:"",h:"그림, 음악, 운동, 애니",a:"경기도 동두천시",t:"나라고 나",c:"동두천시",km:10,x:252.1,y:116.4},
{n:"김보라",gh:"https://github.com/KIMBORA050411",pg:"https://kimbora050411.github.io/050411/",h:"공포 보기",a:"경기도 의정부시 금오동",t:"김복돌",c:"의정부시",km:7,x:255.7,y:251.4},
{n:"김승기",gh:"https://github.com/Seung7l",pg:"https://seung7l.github.io/DoSiMoonWhaSulGye/",h:"네줄기타",a:"경기도 구리시 인창동",t:"바로바로 나!",c:"구리시",km:24,x:309.1,y:384.6},
{n:"문민희",gh:"https://github.com/massiag41-art",pg:"https://massiag41-art.github.io/1233/",h:"게임",a:"경기도 남양주시",t:"가족,망고,여름",c:"남양주시",km:24,x:363.2,y:357.6},
{n:"민제희",gh:"https://github.com/alfmekfn5",pg:"https://alfmekfn5.github.io/555/",h:"게임, 운동, 기깔나게 자기",a:"강원도 춘천시",t:"가족들, 이연우",c:"춘천시",km:58,x:729.2,y:137.1},
{n:"윤수아",gh:"https://github.com/tndk0512-ux",pg:"https://tndk0512-ux.github.io/index/",h:"기타,애니,음악듣기",a:"서울특별시 송파구 마천동",t:"동생",c:"송파구",km:36,x:316.2,y:484.5},
{n:"이지민",gh:"https://github.com/leejimin0",pg:"https://leejimin0.github.io/ezym/",h:"독서",a:"경기도 하남시 망월동",t:"가족",c:"하남시",km:30,x:344.7,y:420.6},
{n:"정유림",gh:"https://github.com/yourrime0502-afk",pg:"https://yourrime0502-afk.github.io/kdu1/",h:"콘서트 관람",a:"동대문구 답십리2동",t:"우리 엄마, 이성열 미모",c:"동대문구",km:28,x:252.1,y:419.7},
{n:"최윤영",gh:"https://github.com/usagi030dd",pg:"https://usagi030dd.github.io/samples/",h:"음악 감상 및 연주(통기타&일렉)",a:"서울특별시 도봉구 쌍문동",t:"엄마",c:"도봉구",km:19,x:231.5,y:345.9},
{n:"최윤지",gh:"https://github.com/choiyg1105-cloud",pg:"https://choiyg1105-cloud.github.io/save/",h:"우쿨렐레, 뜨개질",a:"경기도 포천시",t:"건강",c:"포천시",km:14,x:351.8,y:125.4},
{n:"신단하",gh:"https://github.com/danhaaaa",pg:"https://danhaaaa.github.io/sakuya/",h:"위시 사랑하기",a:"경기도 의정부시 신곡2동",t:"동생",c:"의정부시",km:9,x:257.8,y:267.6}
];
const CAMPUS=[260.7,196.5],KMPX=8.108;
const TABS=[["전체",()=>true],["10km 안",p=>p.km!=null&&p.km<=10],["10–30km",p=>p.km>10&&p.km<=30],["30km 이상",p=>p.km>30]];
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const el=(t,a={},tx)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;return e};
const km=p=>p.km==null?"—":p.km+"km";
let tab=0,sel=0;

const m=$("map");
for(let x=0;x<=960;x+=80)m.append(el("line",{class:"grid",x1:x,y1:0,x2:x,y2:600}));
for(let y=0;y<=600;y+=80)m.append(el("line",{class:"grid",x1:0,y1:y,x2:960,y2:y}));
[10,20,30,40,50].forEach(k=>{const r=k*KMPX;
  m.append(el("circle",{class:"ring",cx:CAMPUS[0],cy:CAMPUS[1],r}));
  m.append(el("text",{class:"ringlbl",x:CAMPUS[0]+r*.82+4,y:CAMPUS[1]+r*.57+4},k+"km"));});
m.append(el("rect",{class:"campus",x:CAMPUS[0]-6,y:CAMPUS[1]-6,width:12,height:12}));
m.append(el("text",{class:"clbl",x:CAMPUS[0]+14,y:CAMPUS[1]+4},"경동대 메트로폴캠퍼스"));
const groups={};P.forEach(p=>{if(p.x!=null)(groups[p.c]??=[]).push(p)});
Object.entries(groups).forEach(([c,a])=>{
  const gx=a.reduce((s,p)=>s+p.x,0)/a.length,gy=Math.min(...a.map(p=>p.y));
  m.append(el("text",{class:"city",x:gx,y:gy-16},c));});
const dots=P.map((p,i)=>{if(p.x==null)return null;
  const d=el("circle",{class:"pdot",cx:p.x,cy:p.y,r:7,tabindex:0,role:"button","aria-label":p.n+", "+p.c});
  d.addEventListener("click",()=>pick(i));
  d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(i)}});
  d.addEventListener("mousemove",e=>tip(e,p.n+" · "+p.c+" · "+km(p)));
  d.addEventListener("mouseleave",()=>$("tip").style.opacity=0);
  m.append(d);return d});
function tip(e,t){const T=$("tip");T.textContent=t;T.style.left=e.clientX+12+"px";T.style.top=e.clientY+12+"px";T.style.opacity=1}

$("nomap").innerHTML="";
P.forEach((p,i)=>{if(p.x!=null)return;
  const s=document.createElement("span");
  s.append(p.far?"지도 밖 · ":"주소 미입력 · ");
  const b=document.createElement("button");b.type="button";b.textContent=p.n+(p.far?" ("+p.c+" "+p.km+"km)":"");
  b.onclick=()=>pick(i);s.append(b);$("nomap").append(s)});

const known=P.filter(p=>p.km!=null);
$("dek").innerHTML="수강생 <strong>"+P.length+"명</strong>이 사는 곳을 학교 기준 거리로 펼쳤어요. 점을 누르면 그 사람의 소개 페이지를 볼 수 있어요.";
$("summary").innerHTML=[
 ["수강생",P.length,"명"],
 ["평균 거리",Math.round(known.reduce((s,p)=>s+p.km,0)/known.length),"km"],
 ["가장 먼 곳",Math.max(...known.map(p=>p.km)),"km"],
 ["제출 페이지",P.filter(p=>p.pg).length,"/ "+P.length]
].map(([k,v,u])=>`<div><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join("");

TABS.forEach(([l,f],i)=>{const b=document.createElement("button");b.className="tab";b.type="button";b.role="tab";
  b.textContent=l+" "+P.filter(f).length;b.onclick=()=>{tab=i;render()};$("tabs").append(b)});

$("rows").innerHTML="";
P.forEach((p,i)=>{const r=document.createElement("tr");
  r.innerHTML=`<td class="m">${String(i+1).padStart(2,"0")}</td><td></td><td></td><td class="m"></td><td></td><td></td><td></td>`;
  const c=r.children;c[1].textContent=p.n;c[2].textContent=p.a||"—";c[3].textContent=km(p);
  c[4].textContent=p.h;c[5].textContent=p.t||"—";
  if(p.pg){const a=document.createElement("a");a.href=p.pg;a.target="_blank";a.rel="noopener";a.textContent="열기 ↗";a.onclick=e=>e.stopPropagation();c[6].append(a)}else c[6].textContent="—";
  r.onclick=()=>pick(i);$("rows").append(r)});

function pick(i){sel=i;render()}
function render(){
  const f=TABS[tab][1];
  [...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-selected",i===tab));
  dots.forEach((d,i)=>{if(d){d.classList.toggle("dim",!f(P[i]));d.classList.toggle("on",i===sel)}});
  [...$("rows").children].forEach((r,i)=>{r.classList.toggle("on",i===sel);r.style.opacity=f(P[i])?1:.4});
  const p=P[sel];
  $("pk").textContent=String(sel+1).padStart(2,"0")+" / "+String(P.length).padStart(2,"0");
  $("pn").textContent=p.n;$("ps").textContent=p.a||"주소를 입력하지 않았어요";
  const row=(k,v)=>`<div class="f"><dt>${k}</dt><dd>${v}</dd></div>`;
  const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("pf").innerHTML=
    row("학교에서",p.km==null?'<span class="none">—</span>':p.km+"km"+(p.far?" (지도 밖)":""))+
    row("취미",esc(p.h))+
    row("가장 아끼는 것",p.t?esc(p.t):'<span class="none">—</span>')+
    row("GitHub",`<a href="${p.gh}" target="_blank" rel="noopener">${p.gh.replace("https://github.com/","@")}</a>`);
  const fr=$("frame");fr.innerHTML="";
  if(p.pg){const i=document.createElement("iframe");i.src=p.pg;i.loading="lazy";i.title=p.n+" 페이지 미리보기";i.setAttribute("sandbox","");fr.append(i);$("popen").href=p.pg;$("popen").style.visibility="visible"}
  else{fr.innerHTML='<div class="empty">제출한 페이지가 아직 없어요</div>';$("popen").style.visibility="hidden"}
}
$("prev").onclick=()=>pick((sel+P.length-1)%P.length);
$("next").onclick=()=>pick((sel+1)%P.length);
$("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"};
render();
</script>
</body>
</html>
